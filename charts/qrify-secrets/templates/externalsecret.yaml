{{- range .Values.secrets }}
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ .name }}
spec:
  refreshInterval: {{ $.Values.refreshInterval | default "5m" | quote }}
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: {{ .name }}
    creationPolicy: Owner
  dataFrom:
    - extract:
        # remoteKey overrides the SM leaf name when the K8s Secret name differs
        # (e.g. qrify-web-cognito / qrify-web-api-cognito → qrify/<env>/qrify-cognito).
        key: {{ printf "%s/%s/%s" $.Values.secretPrefix $.Values.environment (.remoteKey | default .name) | quote }}
{{- end }}
